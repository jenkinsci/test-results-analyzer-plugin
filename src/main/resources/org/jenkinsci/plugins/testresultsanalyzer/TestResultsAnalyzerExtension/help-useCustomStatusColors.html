<div>
    Override the colours used for each status in the Test Results Analyzer table and charts.
    Enter each colour as a hex value, for example <code>#1ea64b</code> or <code>#1a4</code>.
    <br/><br/>
    When unchecked, the analyzer uses the status colours of the active Jenkins theme,
    so it adapts to light and dark themes automatically.
</div>
